<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>fd-ledger · example</title>
<!-- Works straight from disk: the component is inlined below (tools/fd-sync.mjs keeps the copy identical to fd-ledger.js).
     In a project: <script type="module" src="fd-ledger.js"></script> -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap">
<style>body{margin:0;padding:32px 16px;font-family:Figtree,sans-serif;background:#141619;color:#ECE8E1;display:grid;gap:24px;max-width:720px}
[data-theme=light] body{background:#EFEAE1;color:#1C1E21} button.t{font:inherit;padding:8px 12px}</style></head><body>
<div><button class="t" onclick="const h=document.documentElement;const l=h.dataset.theme!=='light';h.dataset.theme=l?'light':'dark';document.querySelectorAll('[data-x]').forEach(e=>e.setAttribute('theme',l?'light':'dark'))">Dark / Paper</button></div>
<fd-ledger data-x items='[{"company":"ps","text":"DS questionnaire","meta":"18 answers"},{"company":"at","text":"Management report","meta":"page"}]'></fd-ledger>
<fd-ledger data-x reward items='[{"company":"ps","text":"Receipts","meta":"3 photos"}]'></fd-ledger>
<!-- fd-inline:begin -->
<script type="module">
/**
 * <fd-ledger>: "Done today" (Friday DS v0.3, S5 component 5a). One quiet ledger, not tiles (S4 lenses 2, 11).
 * When nothing needs him the ledger is the reward and takes full weight (reward attribute: larger rows, a one-line total);
 * otherwise it stays quiet under the things that need him.
 *
 *   <fd-ledger items='[{"company":"ps","text":"DS questionnaire","meta":"18 answers","href":"/ps/ds"}]'></fd-ledger>
 *   <fd-ledger reward items='…'></fd-ledger>
 */
// fd-shared:begin (generated by tools/fd-sync.mjs from tools/fd-shared.js and fd-tokens/tokens; do not edit inside)
// Shared code for every fd-* component (Friday DS). tools/fd-sync.mjs pastes this file, with the token table filled in,
// between the fd-shared markers of each component, so every component stays one standalone file (no imports, no build
// step for whoever uses it). Edit this file or the tokens (fd-tokens/tokens/*.json), then run `node tools/fd-sync.mjs`.
const FD_T = {"base":{"ff":"'Figtree',sans-serif","fs-xs":"12px","fs-sm":"13px","fs-md":"15px","fs-base":"16px","fs-lg":"19px","fs-xl":"23px","fs-2xl":"28px","fs-dial":"34px","fw-regular":"400","fw-medium":"500","fw-strong":"600","lh-tight":"1.15","lh-text":"1.45","lh-loose":"1.6","tr-label":"0.13em","sp-1":"2px","sp-2":"4px","sp-3":"8px","sp-4":"12px","sp-5":"16px","sp-6":"24px","sp-7":"32px","sp-8":"48px","sp-9":"64px","r-sm":"6px","r-md":"9px","r-lg":"12px","r-xl":"14px","r-round":"999px","st-hair":"1px","st-icon":"1.6px","st-tick":"1px","st-segment-lit":"0.13","st-segment-rest":"0.085","st-segment-need":"0.16","st-segment-done":"0.05","st-segment-gap":"3px","sz-focus-ring":"2px","sz-focus-offset":"2px","sz-target":"44px","sz-target-dense":"36px","sz-icon":"24px","sz-icon-sm":"20px","sz-dial-phone":"36px","sz-dial-desktop":"64px","d-enter":"200ms","d-change":"250ms","d-leave":"160ms","d-breath":"4500ms","d-reduced-fade":"150ms","e-out":"cubic-bezier(0.2,0,0,1)","e-in":"cubic-bezier(0.4,0,1,1)","e-breath":"cubic-bezier(0.45,0,0.55,1)","rule-max-flashes-per-second":"3","rule-breath-min-brightness":"0.62","rule-loops-allowed":"1","rule-sound":"off","d-answered-leave":"160ms","d-undo-window":"6000ms","grid-max":"1320px","grid-gutter":"16px","grid-gap":"16px"},"dark":{"field":"#141619","field-deep":"#0E1012","surface":"#1A1D21","raised":"#202428","line":"#2C3035","line-soft":"#24282C","text":"#ECE8E1","muted":"#9A968F","amber-ink":"#1B1205","mq":"#4287EB","at":"#CF84BD","ps":"#86EB8A","amb":"#E9880B","mq-dim":"#37598C","at-dim":"#724D69","ps-dim":"#336336","text-dim":"#5A5955","hover-bg":"#202428","pressed-bg":"#2F3134","hover-line":"#9A968F","amber-pressed":"#E99425","disabled-text":"#5A5955","disabled-line":"#24282C","focus":"#ECE8E1","glow":"#FEAA59","fault":"#9A968F","shadow-panel":"0px 10px 24px 0px #0000005A,inset 0px 1px 0px 0px #FFFFFF0B","btn-glow":"0 0 14px color-mix(in srgb,#FEAA59 70%,transparent)","halo-o":".8","halo-blur":"3px","paper":"0","grain":"0.035"},"light":{"field":"#EFEAE1","field-deep":"#ECE7DD","surface":"#FBF9F5","raised":"#FFFFFF","line":"#D6D0C6","line-soft":"#E4DFD6","text":"#1C1E21","muted":"#5C5852","amber-ink":"#140C02","mq":"#134299","at":"#AE69A1","ps":"#249661","amb":"#C76A13","mq-dim":"#9BACC8","at-dim":"#BAA5B5","ps-dim":"#96B1A0","text-dim":"#AAAAAC","hover-bg":"#FFFFFF","pressed-bg":"#EBEAE6","hover-line":"#5C5852","amber-pressed":"#CE7C2F","disabled-text":"#AAAAAC","disabled-line":"#E4DFD6","focus":"#1C1E21","glow":"#C76A13","fault":"#5C5852","shadow-panel":"0 1px 0 #FFFFFF inset,0 6px 16px rgba(60,45,25,.08)","btn-glow":"0 0 0 2px color-mix(in srgb,#C76A13 30%,transparent)","halo-o":".6","halo-blur":"1.5px","paper":"0.16","grain":"0"}};
// Every token becomes --_<name> inside the shadow root. A page themes all components at once with --fd-<name> (fd-tokens.css
// sets them for dark and for [data-theme=light]); theme="dark|light" on one element pins its own values.
const FD_V = (o, pinned) => Object.entries(o).map(([k, v]) => `--_${k}:${pinned ? v : `var(--fd-${k},${v})`};`).join('');
const FD_TOKENS = `:host{${FD_V(FD_T.base)}${FD_V(FD_T.dark)}color-scheme:dark}`
  + `:host([theme=dark]){${FD_V(FD_T.dark, 1)}color-scheme:dark}`
  + `:host([theme=light]){${FD_V(FD_T.light, 1)}color-scheme:light}`
  + `@media (prefers-color-scheme:light){:host(:not([theme])){${FD_V(FD_T.light)}}}`;
const FD_CSS = FD_TOKENS + `
:host{font-family:var(--_ff);color:var(--_text);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;box-sizing:border-box}
:host([hidden]){display:none!important}
*,*::before,*::after{box-sizing:border-box}
.lbl{font-size:var(--_fs-xs);letter-spacing:var(--_tr-label);text-transform:uppercase;color:var(--_muted);font-weight:var(--_fw-medium);margin:0 0 var(--_sp-3);display:flex;align-items:center;gap:var(--_sp-3);line-height:1.2}
.lbl::after{content:"";flex:1;height:var(--_st-hair);background:var(--_line)}
.dot{display:inline-block;width:8px;height:8px;border-radius:var(--_r-round);vertical-align:1px;margin-right:var(--_sp-2);flex:none}
.mu{color:var(--_muted)}
.ic{flex:none;display:inline-grid;place-items:center}
.ic svg{display:block}
.ic path{fill:none;stroke-width:var(--_st-icon);stroke-linecap:round;stroke-linejoin:round}
/* buttons (component 8): primary = amber, only for a single action on what needs him; outline = Friday's suggestion;
   plain = everything else. Yes and No are always two plain buttons of equal weight (his ds-s4-18). */
.btn{font:var(--_fw-strong) var(--_fs-sm)/1.25 var(--_ff);min-height:var(--_sz-target);min-width:var(--_sz-target);padding:var(--_sp-3) var(--_sp-5);max-width:100%;overflow-wrap:break-word;text-align:center;
 border-radius:var(--_r-md);border:var(--_st-hair) solid var(--_line);color:var(--_text);background:transparent;display:inline-flex;
 align-items:center;justify-content:center;gap:var(--_sp-2);cursor:pointer;white-space:normal;text-decoration:none;   /* long words wrap inside the button, never over the next one (his msg 3056) */
 
 transition:background-color var(--_d-change) var(--_e-out),border-color var(--_d-change) var(--_e-out)}
@media (min-width:900px) and (pointer:fine){.btn{min-height:var(--_sz-target-dense)}}
@media (hover:hover){.btn:hover{background:var(--_hover-bg);border-color:var(--_hover-line)}}   /* touch screens keep no hover look after a tap (his 11-10) */
.btn:active{background:var(--_pressed-bg)}
/* focus is dashed with a gap, so it never reads as Friday's solid suggestion outline (S5 lenses 3, 4, 11) */
.btn:focus-visible{outline:var(--_sz-focus-ring) dashed var(--_focus);outline-offset:3px}
.btn.primary{background:var(--_amb);border-color:var(--_amb);color:var(--_amber-ink);box-shadow:var(--_btn-glow)}
@media (hover:hover){.btn.primary:hover{background:var(--_amb);border-color:var(--_amber-ink)}}
.btn.primary:active{background:var(--_amber-pressed);border-color:var(--_amber-pressed)}
.btn.suggest{border:2px solid var(--_text);padding:0 calc(var(--_sp-5) - 1px)}
.btn.plain{border-color:transparent}
@media (hover:hover){.btn.plain:hover{border-color:var(--_line)}}
.btn:disabled,.btn[aria-disabled=true]{cursor:default;color:var(--_disabled-text);border-color:var(--_disabled-line);background:transparent;box-shadow:none}
.btn.primary:disabled{background:transparent;border-color:var(--_disabled-line)}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
/* one entrance for a result of his own tap (receipt, answer): d-enter, ease-out, once (S5 r2 lens 9) */
@keyframes fdin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{transition-duration:var(--_d-reduced-fade)!important;animation:none!important}}
`;
// thin outline icons, 1.6 px on a 24 grid (his S3 pick B). "run" was redrawn twice in S5: the S4 circle-arrow read as
// "refresh" (S4 lens 10), the first S5 arrow-to-bar read as Tab / skip to end (S5 lenses 2, 3, 10); it is now the dial's own
// sign, a short lit arc, drawn by fd-run-row in the company colour so the row and its segment are one symbol.
// "stale" is a clock (time-based sign for time-based data), never the "!" of an alert (S5 lens 10).
const FD_ICONS = {
  ask: 'M5 5h14v10H10l-5 4z', check: 'M5 12.5l4.2 4.2L19 7', clock: 'M12 4a8 8 0 1 0 .01 0z M12 8v4.5l3 2',
  fix: 'M14.5 5.5a4 4 0 0 0-5 5L4 16v4h4l5.5-5.5a4 4 0 0 0 5-5l-2.5 2.5-3-3z', doc: 'M7 3h7l4 4v14H7z M14 3v4h4',
  run: 'M5 16.5a8 8 0 0 1 14 0', 'run-s5a': 'M4 12h12 M12.5 7.5L17 12l-4.5 4.5 M20.5 6v12', 'run-s4': 'M19.5 12a7.5 7.5 0 1 1-2.2-5.3 M19.5 4.5v3.8h-3.8',
  stale: 'M12 4a8 8 0 1 0 .01 0z M12 8v4.5l3 2', empty: 'M5 12h14',
};
const fdIcon = (g, colour, size = 24) => `<span class="ic" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true"><path d="${FD_ICONS[g] || FD_ICONS.doc}" style="stroke:${colour}"/></svg></span>`;
const FD_NAME = { mq: 'Marquatica', at: 'Atípica', ps: 'Personal' };
// the dial's signs at row size (S6 gap G4): run = lit arc, rest = lighter thinner arc, done = thread, fault = dashed muted,
// need = the amber ask mark. k = company (mq|at|ps) or null for Friday's own jobs (text colour).
const FD_STATE_WORD = { running: 'run', run: 'run', idle: 'rest', rest: 'rest', waiting: 'rest', done: 'done', 'Friday fixing it': 'fault', fault: 'fault', fixing: 'fault', 'needs you': 'need', need: 'need' };
const fdSign = (state, k, size = 20) => {
  const s = FD_STATE_WORD[state] || state;
  if (s === 'need') return fdIcon('ask', 'var(--_amb)', size);
  const col = { run: k ? `var(--_${k})` : 'var(--_text)', rest: k ? `var(--_${k}-dim)` : 'var(--_text-dim)', done: 'var(--_text-dim)', fault: 'var(--_fault)' }[s] || 'var(--_text-dim)';
  const w = { run: 3, rest: 2, done: 1.2, fault: 2 }[s] || 2;
  return `<span class="ic" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true"><path d="${FD_ICONS.run}" style="stroke:${col};stroke-width:${w}px${s === 'fault' ? ';stroke-dasharray:2.5 2.5;stroke-linecap:butt' : ''}"/></svg></span>`;
};
const fdEsc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fdCamel = (a) => a.replace(/-([a-z])/g, (_, c) => c.toUpperCase());
const fdJSON = (v, d) => { if (v == null || v === '') return d; if (typeof v !== 'string') return v; try { return JSON.parse(v); } catch { return d; } };
const fdReduced = () => typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
// every observed attribute is also a camelCase property; JSON attributes accept arrays/objects as properties
function fdProps(Cls, attrs, json = []) {
  for (const a of attrs) {
    const p = fdCamel(a);
    if (Object.prototype.hasOwnProperty.call(Cls.prototype, p)) continue;
    Object.defineProperty(Cls.prototype, p, {
      get() { return json.includes(a) ? fdJSON(this.getAttribute(a), this['_' + p]) : this.getAttribute(a); },
      set(v) {
        if (json.includes(a) && v && typeof v === 'object') { this['_' + p] = v; this.removeAttribute(a); this.render?.(); return; }
        if (v === null || v === undefined || v === false) this.removeAttribute(a); else this.setAttribute(a, v === true ? '' : v);
      },
      configurable: true,
    });
  }
}
const fdDefine = (name, Cls) => { if (typeof customElements !== 'undefined' && !customElements.get(name)) customElements.define(name, Cls); };
// fd-shared:end

const LEDGER_ATTRS = ['items', 'reward', 'theme', 'label'];

const LEDGER_CSS = `
:host{display:block}
ol{list-style:none;margin:0;padding:0}
li>*{display:flex;align-items:center;gap:var(--_sp-4);padding:var(--_sp-3) 0;font-size:var(--_fs-sm);color:inherit;text-decoration:none;min-height:var(--_sz-target)}
@media (min-width:900px) and (pointer:fine){li>*{min-height:var(--_sz-target-dense)}}
li+li{border-top:var(--_st-hair) solid var(--_line-soft)}
li a:hover{background:var(--_hover-bg)}li a:focus-visible{outline:var(--_sz-focus-ring) solid var(--_focus);outline-offset:calc(-1 * var(--_sz-focus-ring))}
.x{flex:1;min-width:0}
.m{color:var(--_muted);font-size:var(--_fs-xs);white-space:nowrap}
.sum{font-size:var(--_fs-lg);font-weight:var(--_fw-strong);margin:var(--_sp-2) 0 var(--_sp-3);display:none}
:host([reward]) .sum{display:block}
:host([reward]) li>*{font-size:var(--_fs-md);padding:var(--_sp-4) 0}
.empty{color:var(--_muted);font-size:var(--_fs-sm);padding:var(--_sp-3) 0}
`;

class FdLedger extends HTMLElement {
  static get observedAttributes() { return LEDGER_ATTRS; }
  constructor() { super(); this.attachShadow({ mode: 'open' }); }
  connectedCallback() { this.render(); }
  attributeChangedCallback() { if (this.isConnected) this.render(); }
  get items() { return fdJSON(this.getAttribute('items'), this._items || []); }
  set items(v) { if (typeof v === 'string') this.setAttribute('items', v); else { this._items = v || []; this.removeAttribute('items'); this.render(); } }
  render() {
    const it = this.items || [];
    const rows = it.map((x) => {
      const k = ['mq', 'at', 'ps'].includes(x.company) ? x.company : 'ps';
      const inner = `${fdIcon('check', 'var(--_text)', 20)}<span class="x">${fdEsc(x.text)}</span><span class="m"><span class="dot" style="background:var(--_${k})"></span>${fdEsc(FD_NAME[k])}${x.meta ? ' · ' + fdEsc(x.meta) : ''}</span>`;
      return `<li>${x.href ? `<a href="${fdEsc(x.href)}">${inner}</a>` : `<div>${inner}</div>`}</li>`;
    }).join('');
    const sum = it.length ? `${it.length} done today` : '';
    this.shadowRoot.innerHTML = `<style>${FD_CSS}${LEDGER_CSS}</style><div class="sum" part="sum">${sum}</div>`
      + (it.length ? `<ol part="list" aria-label="${fdEsc(this.getAttribute('label') || 'Done today')}">${rows}</ol>` : `<div class="empty">What gets done today lands here.</div>`);
  }
}
fdProps(FdLedger, LEDGER_ATTRS.filter((a) => a !== 'items'));
fdDefine('fd-ledger', FdLedger);
export { FdLedger };

</script>
<!-- fd-inline:end -->
</body></html>
